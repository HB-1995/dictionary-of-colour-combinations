<style>
/* VOICE: quiet, gallery-like; the colours speak, the frame stays out of the way.
   IDEA: Wada's pocket swatch book — flat printed chips, numbered plates, tiny captions.
   PICTURE: a full-width ribbon of all 159 colours, then a wall of 348 combination plates.
   COLOUR and TYPE: paper white / ink black only, no accent; Zen Kaku Gothic New throughout.
   LAYOUT: ribbon + search up top, sticky filters, dense grid, a side sheet for detail. */
:root{color-scheme:light dark;--bg:light-dark(#fafaf8,#141413);--ink:light-dark(#18181a,#ececea);--mute:light-dark(#5e5e59,#a09f9a);--faint:light-dark(#8a8a85,#77766f);--line:light-dark(#e6e5e1,#2c2c2b);--line2:light-dark(#dddcd7,#3a3a38);--card:light-dark(#fff,#1d1d1c);--chip:light-dark(#efeeea,#262625);--display:"Zen Kaku Gothic New",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--r:8px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--display)}
h1{font-size:clamp(30px,4.2vw,44px);line-height:1.05;margin:0;font-weight:900;letter-spacing:-.015em;text-wrap:balance}
.eyebrow{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.sub{color:var(--mute);margin:.6em 0 0}
/* header: wordmark · sections · account */
.hdr{border-bottom:1px solid var(--line);padding:0 max(4vw,16px)}
.hrow{display:flex;align-items:center;gap:12px 28px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo{display:flex;width:28px;height:28px;border-radius:6px;overflow:hidden}.logo i{flex:1}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:var(--r);padding:8px 12px;min-height:40px;color:var(--mute);font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--chip);color:var(--ink);font-weight:600}
.tabs svg{display:none}
#auth{display:flex;gap:10px;align-items:center;font-size:14px}

.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ibtn.sq{width:40px;min-width:40px;height:40px;padding:0;display:grid;place-items:center}.ibtn.sq svg{width:18px;height:18px}
/* intro: title + search */
.top{display:flex;justify-content:space-between;gap:24px 48px;align-items:flex-end;flex-wrap:wrap}.ttl{flex:1 1 420px}
.searchrow{display:flex;gap:8px;flex:1 1 440px;max-width:560px}
.search{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);box-shadow:0 1px 2px #0000000a}
.search:focus-within{border-color:var(--ink)}
.search svg{width:18px;height:18px;flex:none;color:var(--mute)}
#q{flex:1;border:0;outline:0;background:none;height:100%;padding:0;font-size:15px}
.search kbd{font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 6px}
/* ribbon: every colour, grouped by hue family; the labels are the family shortcuts */

/* the one sticky toolbar */

#pname{font-size:20px;font-weight:700;margin:4px 0 16px}.pstripbig{height:170px}.strip.vstrip{height:15px}

.wt{width:64px;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--card);padding:0 6px;font-size:16px}
.ptable .rec{min-width:150px}.handle{cursor:grab;color:var(--mute);width:22px;user-select:none}tr.dragover td{border-top:2px solid var(--ink)}
.custom{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.custom .field{width:auto;flex:1 1 140px}
input[type=color]{width:52px;height:44px;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);padding:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.schip{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:4px 14px 4px 5px;display:flex;align-items:center;gap:4px;font-size:14px;min-height:44px}.schip .dot{width:32px;height:32px;border-radius:50%;margin-right:6px}
.danger{color:#c2361f}.newstrip{align-items:center;justify-content:center;border:1.5px dashed var(--line);box-shadow:none;color:var(--mute)}
.emptystrip{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;background:var(--chip)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px #0002;padding:10px max(4vw,16px)}
.dockin{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto auto;gap:12px;align-items:center}.dstrip{height:44px}
body.adding{padding-bottom:96px}body.adding .card,body.adding .ribbon button{cursor:copy}
@media(max-width:700px){.dockin{grid-template-columns:1fr 1fr}.dockin>div:first-child,.dstrip{grid-column:1/-1}}
.ptiles{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.pcard .meta{display:block}.pcard .meta span{display:block;white-space:normal}.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-top:14px}

.addp{position:absolute;top:6px;right:6px;z-index:2;width:30px;height:30px;border-radius:50%;border:1px solid #ffffff99;background:#00000040;backdrop-filter:blur(4px);color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s}
.addp:hover{background:#00000080}.addp.on{background:var(--ink);color:var(--bg);border-color:transparent;font-size:15px}

h2{font-size:22px;margin:40px 0 16px;font-weight:700}

/* Colour libraries ("sources") are listed in sources.json. Each source is one file of colours and palettes.
   format "wada": the original colors.json layout. format "palettes": {colours:[{name,hex,cmyk?,family?}],palettes:[{id?,name?,colours:[names]}]}.
   Palette ids are idBase + the palette's own number, so every source keeps its own numbering without clashing. */
const DEFAULT_SOURCES=[{id:'wada-1',name:'A Dictionary of Color Combinations, Volume 1',short:'Wada Vol 1',byline:'Sanzo Wada · Volume 1',file:'colors.json',format:'wada',idBase:0}];
fetch('sources.json').then(r=>r.ok?r.json():DEFAULT_SOURCES).catch(()=>DEFAULT_SOURCES).then(S=>Promise.all([
 Promise.all(S.map(s=>fetch(s.file).then(r=>r.json()).then(d=>[s,d]).catch(()=>{console.error('Could not load source',s.id);return null}))),
 fetch('paints.json').then(r=>r.json()).catch(()=>[])])).then(([loaded,paints])=>{window.__PAINTS=paints;
const SOURCES=[],SBY={},C=[],COMBOS={},PSRC={},PNAME={};
loaded.filter(Boolean).forEach(([s,d])=>{const base=+s.idBase||0,src={...s,base};SOURCES.push(src);SBY[s.id]=src;
 if(s.format==='wada')d.forEach(x=>C.push({n:x.name,h:x.hex.toUpperCase(),c:x.cmyk,l:x.lab,s:x.swatch+1,k:x.combinations.map(k=>base+k),src:s.id}));
 else{const idx={};(d.colours||[]).forEach(x=>{const h=x.hex.toUpperCase();idx[x.name]=C.length;C.push({n:x.name,h,c:x.cmyk||null,l:null,s:+x.family||0,k:[],src:s.id})});
  (d.palettes||[]).forEach((p,pi)=>{const id=base+(+p.id||pi+1);if(p.name)PNAME[id]=p.name;p.colours.forEach(nm=>{const i=idx[nm];if(i!=null&&!C[i].k.includes(id))C[i].k.push(id)})})}});

C.forEach((c,i)=>c.k.forEach(k=>{(COMBOS[k]??=[]).push(i);PSRC[k]=c.src}));

function famOf(h){const L=lab(h);if(Math.hypot(L[1],L[2])<10)return 6;const H=hsl(h)[0];return H<15||H>=330?1:H<70?2:H<165?3:H<255?4:5}

try{Object.assign(st,{wheel:localStorage.getItem('w-wheel')||'ryb',show:localStorage.getItem('w-show')||'exact',lib:localStorage.getItem('w-lib')||'all'})}catch(e){}

/* the library: which sources you browse, and which colours "nearest", complements and suggestions draw from */
const inLibC=i=>st.lib==='all'||C[i].src===st.lib,inLibP=id=>st.lib==='all'||PSRC[id]===st.lib;
const libName=()=>st.lib==='all'?(MULTI?'all libraries':SOURCES[0].short):SBY[st.lib].short;

/* palette labels: the primary source keeps its plain numbers (240); others read "Short 12" or their own name */
const pnum=id=>id-SBY[PSRC[id]].base;
const plabel=id=>PSRC[id]===PRIMARY?String(id):`${SBY[PSRC[id]].short} ${pnum(id)}`;

let favs=[];try{favs=JSON.parse(localStorage.getItem('w-favs')||'[]')}catch(e){}

 document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.outerHTML=favBtn(id));const f=document.getElementById('fav');if(f&&cur&&cur.combo===id)f.textContent=on?'★ Saved':'☆ Save';

/* colour maths */
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
function hsl(h){const [r,g,b]=rgb(h).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let H=0,S=0;
 if(d){S=d/(1-Math.abs(2*l-1));H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;if(H<0)H+=360}return [H,S,l]}
function fromHsl(H,S,L){H=((H%360)+360)%360;const c=(1-Math.abs(2*L-1))*S,x=c*(1-Math.abs((H/60)%2-1)),m=L-c/2;
 const [r,g,b]=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];return hex([r,g,b].map(v=>(v+m)*255))}
function lab(h){const v=rgb(h).map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4});
 const X=(v[0]*.4124+v[1]*.3576+v[2]*.1805)/.95047,Y=v[0]*.2126+v[1]*.7152+v[2]*.0722,Z=(v[0]*.0193+v[1]*.1192+v[2]*.9505)/1.08883;
 const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return [116*f(Y)-16,500*(f(X)-f(Y)),200*(f(Y)-f(Z))]}
const dE=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const chroma=c=>Math.hypot(c.l[1],c.l[2]);
/* painter's (RYB) wheel: piecewise map between screen hue and artist hue */
const A=[[0,0],[30,60],[60,120],[120,180],[240,240],[285,300],[360,360]];
function mapH(h,f,t){h=((h%360)+360)%360;for(let i=0;i<A.length-1;i++){const a=A[i],b=A[i+1];if(h>=a[f]&&h<=b[f])return a[t]+(h-a[f])/(b[f]-a[f])*(b[t]-a[t])}return h}
const toRyb=h=>mapH(h,0,1),fromRyb=h=>mapH(h,1,0);
const wheelAngle=(h,m)=>m==='ryb'?toRyb(hsl(h)[0]):hsl(h)[0];
function comp(h,m){const [H,S,L]=hsl(h);return fromHsl(m==='ryb'?fromRyb(toRyb(H)+180):H+180,S,L)}
function nearest(h,n=1,skip=-1){const L=lab(h);return C.map((c,i)=>[i,dE(L,c.l)]).filter(x=>x[0]!==skip&&inLibC(x[0])).sort((a,b)=>a[1]-b[1]).slice(0,n)}
const textOn=h=>lab(h)[0]>60?'#1a1a1a':'#fafafa';
const mix=(h,t,p)=>hex(rgb(h).map((v,i)=>v+(rgb(t)[i]-v)*p));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
C.forEach(c=>{if(!c.l)c.l=lab(c.h);if(!c.s)c.s=famOf(c.h)});

/* rendering pieces */
const strip=ids=>`<div class="strip">${ids.map(i=>`<span style="background:${C[i].h}"></span>`).join('')}</div>`;
const favBtn=id=>{const on=favs.includes(id);return `<button class="addp star ${on?'on':''}" data-fav="${id}" aria-pressed="${on}" aria-label="${on?'Remove combination '+id+' from':'Save combination '+id+' to'} saved combinations" title="${on?'Saved — click to remove':'Save combination'}">${on?'★':'☆'}</button>`};
const card=id=>`<div class="ccard" data-id="${id}">${user?favBtn(id):''}<button class="card" data-combo="${id}" title="${esc(ptitle(id))}${MULTI?' · '+esc(SBY[PSRC[id]].short):''}: ${esc(COMBOS[id].map(i=>C[i].n).join(' · '))}" aria-label="${esc(ptitle(id))}: ${esc(COMBOS[id].map(i=>C[i].n).join(', '))}">${strip(COMBOS[id])}<div class="meta"><b class="num">${PSRC[id]===PRIMARY?'No. ':''}${esc(plabel(id))}</b><span class="cnames">${esc(COMBOS[id].map(i=>C[i].n).join(' · '))}</span></div></button></div>`;
/* colours as a list: name, codes, tint → shade and how often each is used */
try{st.cview=localStorage.getItem('w-cview')||'list'}catch(e){st.cview='list'}st.cf='';
const cfMatch=i=>{const q=st.cf.trim().toLowerCase();if(!q)return true;const c=C[i];return c.n.toLowerCase().includes(q)||c.h.toLowerCase().includes(q.replace(/^#?/,'#'))||(c.c&&c.c.join(' ').startsWith(q.replace(/[,\/]+/g,' ').replace(/\s+/g,' ')))};
const useOf=i=>C[i].k.filter(inLibP).length;
const lscale=h=>`<span class="lscale" aria-hidden="true">${[.6,.4,.2].map(p=>`<i style="background:${mix(h,'#ffffff',p)}"></i>`).join('')}<i style="background:${h}"></i>${[.2,.4,.6].map(p=>`<i style="background:${mix(h,'#000000',p)}"></i>`).join('')}</span>`;
const lrow=(i,max)=>{const c=C[i],n=useOf(i);return `<button class="lrow" data-colour="${i}"><span class="lsw" style="background:${c.h}"></span><span class="lname">${hl(c.n)}${MULTI&&st.lib==='all'?`<small>${esc(SBY[c.src].short)}</small>`:''}</span><span class="code">${c.h}</span><span class="code lcmyk">${c.c?c.c.join(' / '):'—'}</span>${lscale(c.h)}<span class="luse" title="Appears in ${n} combination${n===1?'':'s'}"><span class="lbar"><i style="width:${Math.round(n/max*100)}%"></i></span><span class="code">${n}</span></span></button>`};
function cwrap(ids){if(st.cview==='grid')return `<div class="tiles">${ids.map(tile).join('')}</div>`;const max=Math.max(1,...C.map((c,i)=>inLibC(i)?useOf(i):0));
 return `<div class="clist"><div class="lhead" aria-hidden="true"><span></span><span>Name</span><span>Hex</span><span class="lcmyk">CMYK</span><span class="lscale-h">Tint → shade</span><span class="luse-h"><span class="lg">Combinations</span><span class="sm">Uses</span></span></div>${ids.map(i=>lrow(i,max)).join('')}</div>`}
const hl=n=>{const q=(st.q.trim()||(st.tab==='colours'?st.cf.trim():'')).toLowerCase(),k=q&&!/^[#\d]/.test(q)?n.toLowerCase().indexOf(q):-1;return k<0?esc(n):esc(n.slice(0,k))+'<mark>'+esc(n.slice(k,k+q.length))+'</mark>'+esc(n.slice(k+q.length))};
const tile=i=>`<button class="card tile" data-colour="${i}"><div class="sw" style="background:${C[i].h}"></div><div class="meta"><b>${hl(C[i].n)}</b><span>${C[i].h}${C[i].c?' · '+cmykOf(i):''}${MULTI&&st.lib==='all'?' · '+esc(SBY[C[i].src].short):''}</span><span><i class="gd" style="background:${GDOT[C[i].s]}"></i>${GSHORT[C[i].s]}</span></div></button>`;
/* temperature on the painter's (RYB) wheel: orange warmest, blue coolest; weighted by chroma so greys sit near 0 */
const warmth=c=>Math.hypot(c.l[1],c.l[2])*Math.cos((toRyb(hsl(c.h)[0])-60)*Math.PI/180);
const tempBand=w=>w>8?'warm':w<-8?'cool':'neutral';
const sortKey={temp:id=>-COMBOS[id].reduce((s,i)=>s+warmth(C[i]),0)/COMBOS[id].length,book:()=>0,hue:id=>hsl(C[COMBOS[id][0]].h)[0],light:id=>-COMBOS[id].reduce((s,i)=>s+C[i].l[0],0)/COMBOS[id].length,sat:id=>-COMBOS[id].reduce((s,i)=>s+chroma(C[i]),0)/COMBOS[id].length};
function filtered(){let L=IDS.filter(id=>inLibP(id)&&(!st.size||COMBOS[id].length===st.size)&&(!st.chap||COMBOS[id].some(i=>C[i].s===st.chap)));
 if(st.sort!=='book'){const f=sortKey[st.sort];L=L.map(id=>[id,f(id)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0])}return L}

function search(q){q=q.trim();const lq=q.toLowerCase();let m,cols=[],combos=[],note='';
 if((m=lq.match(/^#?(\d{1,3})$/))&&COMBOS[+m[1]]){combos=[+m[1]];cols=COMBOS[+m[1]]}
 else if(m=lq.match(/^#?([0-9a-f]{6})$/)){const h='#'+m[1].toUpperCase();const nn=nearest(h,8);cols=nn.map(x=>x[0]);note=!nn.length?'':nn[0][1]<1?`Exact match: ${esc(C[nn[0][0]].n)}.`:`No exact match for ${h}: nearest colours in ${esc(libName())}, closest first.`;combos=nn.length?[...new Set(C[cols[0]].k)]:[]}
 else if((m=lq.match(/^(\d{1,3})[\s,\/]+(\d{1,3})[\s,\/]+(\d{1,3})[\s,\/]+(\d{1,3})$/))){const v=m.slice(1,5).map(Number);const nn=C.map((c,i)=>[i,c.c?Math.hypot(...c.c.map((x,j)=>x-v[j])):Infinity]).filter(x=>x[1]<Infinity&&inLibC(x[0])).sort((a,b)=>a[1]-b[1]).slice(0,8);cols=nn.map(x=>x[0]);note=!nn.length?'':nn[0][1]===0?`Exact CMYK match: ${esc(C[cols[0]].n)}.`:'Closest CMYK values.';combos=nn.length?[...new Set(C[cols[0]].k)]:[]}
 else{cols=C.map((c,i)=>i).filter(i=>inLibC(i)&&C[i].n.toLowerCase().includes(lq));combos=[...new Set(cols.flatMap(i=>C[i].k))].sort((a,b)=>a-b)}

function render(){const v=$('#view');
 $('.bar').hidden=(st.tab==='mine'&&!st.q.trim())||st.tab==='paints';{const col=st.tab==='colours'&&!st.q.trim();$('#cview').hidden=$('.cfilter').hidden=!col;$('#count').classList.toggle('offcol',col);$('#fsize').hidden=$('.bar .vsep').hidden=col;setSeg($('#cview'),st.cview)}
 if(st.tab==='paints'){v.innerHTML=paintsView();balanceTiles();return}
 if(st.q.trim()){const r=search(st.q);r.combos=r.combos.filter(id=>inLibP(id)&&(!st.size||COMBOS[id].length===st.size)&&(!st.chap||COMBOS[id].some(i=>C[i].s===st.chap)));$('#count').textContent=`${r.cols.length} colours · ${r.combos.length} combinations`;
  v.innerHTML=(r.note?`<p class="note">${r.note}</p>`:'')+(r.cols.length?`<h2>Colours</h2><div class="tiles">${r.cols.map(tile).join('')}</div>`:'')+(r.combos.length?`<h2>Combinations</h2><div class="grid">${r.combos.map(card).join('')}</div>`:'')+(!r.cols.length&&!r.combos.length?'<p class="empty">Nothing matches. Try a colour name, a combination number, a hex code or four CMYK numbers.</p>':'');return}
 if(st.tab==='combos'){const L=filtered();$('#count').textContent=`${L.length===IDS.length?L.length:L.length+' of '+IDS.length} ${MULTI?'palettes':'combinations'}`;v.innerHTML=L.length?`<div class="grid">${L.map(card).join('')}</div>`:'<p class="empty">No combinations match these filters.</p>'}
 else if(st.tab==='colours'){let L=C.map((c,i)=>i).filter(i=>inLibC(i)&&(!st.chap||C[i].s===st.chap)&&cfMatch(i));
  if(st.sort==='hue')L.sort((a,b)=>hsl(C[a].h)[0]-hsl(C[b].h)[0]);if(st.sort==='light')L.sort((a,b)=>C[b].l[0]-C[a].l[0]);if(st.sort==='sat')L.sort((a,b)=>chroma(C[b])-chroma(C[a]));if(st.sort==='temp')L.sort((a,b)=>warmth(C[b])-warmth(C[a]));
  $('#count').textContent=`${L.length} of ${C.length} colours`;
  v.innerHTML=!L.length?'<p class="empty">No colours match this filter.</p>':st.sort==='temp'?[['warm','Warm','Reds, oranges and yellows: they advance'],['neutral','Neutral','Greys, earths and muted colours with little pull either way'],['cool','Cool','Greens, blues and violets: they recede']].map(([k,n,d])=>{const g=L.filter(i=>tempBand(warmth(C[i]))===k);return g.length?`<h2>${n} <span class="hsub">${g.length} colours · ${d}</span></h2>${cwrap(g)}`:''}).join(''):st.sort==='book'&&!st.chap?[1,2,3,4,5,6].filter(s=>L.some(i=>C[i].s===s)).map(s=>`<h2><i class="gd gd-l" style="background:${GDOT[s]}"></i>${GROUPS[s]} <span class="hsub">${L.filter(i=>C[i].s===s).length} colours · ${GDESC[s]}</span></h2>${cwrap(L.filter(i=>C[i].s===s))}`).join(''):(st.chap&&st.sort==='book'?`<h2><i class="gd gd-l" style="background:${GDOT[st.chap]}"></i>${GROUPS[st.chap]} <span class="hsub">${L.length} colours · ${GDESC[st.chap]}</span></h2>`:'')+`${cwrap(L)}`}
 else{$('#count').textContent=`${pals.length} palette${pals.length===1?'':'s'}`;
  v.innerHTML=(loadErr?`<p class="empty" style="color:#c2361f">${esc(loadErr)}</p>`:'')+`<h2>My palettes</h2><div class="grid"><button class="card" id="newpal"><div class="strip newstrip"><span>+ New palette</span></div><div class="meta"><b>New palette</b></div></button>${pals.map(p=>`<button class="card" data-pal="${p.id}">${pstrip(p)}<div class="meta"><b>${esc(p.name)}</b><span>${p.colours.length} colour${p.colours.length===1?'':'s'}</span></div></button>`).join('')}</div>
  <h2>Saved combinations</h2>${favs.length?`<div class="grid">${favs.map(card).join('')}</div>`:'<p class="empty">Open any combination and press ☆ Save to keep it here.</p>'}`}}

/* wheel graphic */
/* colour wheel: complements, plus an optional value (lightness) view */
function hueAtL(h,Lt){let lo=0,hi=1;for(let k=0;k<14;k++){const m=(lo+hi)/2;lab(fromHsl(h,.8,m))[0]<Lt?lo=m:hi=m}return fromHsl(h,.8,(lo+hi)/2)}
const nameOf=h=>{const i=C.findIndex(c=>c.h===h);return i>=0?C[i].n:h};
function wheel(hs,m){const S=280,c=S/2,R=128,seg=48,V=!!st.val,avgL=Math.round(hs.reduce((s,h)=>s+lab(h)[0],0)/Math.max(1,hs.length)),wl=st.wl??avgL;let w='';
 for(let k=0;k<seg;k++){const a0=k*360/seg,a1=(k+1)*360/seg,mid=(a0+a1)/2,hh=m==='ryb'?fromRyb(mid):mid,p=a=>[c+R*Math.sin(a*Math.PI/180),c-R*Math.cos(a*Math.PI/180)],[x0,y0]=p(a0),[x1,y1]=p(a1);
  w+=`<path d="M${c},${c}L${x0},${y0}A${R},${R} 0 0 1 ${x1},${y1}Z" fill="${V?hueAtL(hh,wl):fromHsl(hh,.75,.55)}"/>`}
 w+=`<circle cx="${c}" cy="${c}" r="${R*.82}" fill="var(--bg)"/>`;
 hs.forEach((h,n)=>{const Lb=lab(h),a=wheelAngle(h,m),r=R*(.18+.6*Math.min(1,Math.hypot(Lb[1],Lb[2])/80)),pt=a=>[c+r*Math.sin(a*Math.PI/180),c-r*Math.cos(a*Math.PI/180)],[x,y]=pt(a),[x2,y2]=pt(a+180),ch=comp(h,m);
  w+=`<g class="pr" data-pair="${n}"><line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="var(--mute)" stroke-dasharray="3 3"/><circle cx="${x2}" cy="${y2}" r="9" fill="${ch}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 2"/><circle cx="${x}" cy="${y}" r="12" fill="${h}" stroke="var(--ink)" stroke-width="1.5"/></g>`});
 const svg=`<svg class="wheel" viewBox="0 0 ${S} ${S}" role="img" aria-label="${m==='ryb'?"Painter's":'Screen'} colour wheel showing each colour (solid) and its complement (dashed)">${w}</svg>`;
 let vs='';if(V){const H=280,y=L=>10+(100-L)/100*(H-20);let g='';
  for(let k=0;k<=10;k++){const L=100-k*10;g+=`<rect x="34" y="${y(L)-13}" width="22" height="26" fill="${greyOf2(L)}"/>`}
  g=`<clipPath id="vclip"><rect x="34" y="10" width="22" height="${H-20}" rx="3"/></clipPath><g clip-path="url(#vclip)">${g}</g>`;
  g+=`<line x1="34" x2="56" y1="${y(wl)}" y2="${y(wl)}" stroke="var(--ink)" stroke-width="2"/>`;
  [0,50,100].forEach(L=>g+=`<text x="62" y="${y(L)+4}" font-size="10" fill="var(--mute)">${L}</text>`);
  hs.forEach((h,n)=>{const L1=lab(h)[0],L2=lab(comp(h,m))[0];g+=`<g class="pr" data-pair="${n}"><line x1="22" y1="${y(L1)}" x2="68" y2="${y(L2)}" stroke="var(--mute)" stroke-dasharray="3 3"/><circle cx="22" cy="${y(L1)}" r="7" fill="${h}" stroke="var(--ink)" stroke-width="1.5"/><circle cx="68" cy="${y(L2)}" r="6" fill="${comp(h,m)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 2"/></g>`});
  vs=`<svg class="vscale" viewBox="0 0 90 ${H}" role="img" aria-label="Value scale: colours (left) and complements (right) by lightness">${g}</svg>`}
 const pairs=hs.map((h,n)=>{const L1=Math.round(lab(h)[0]),L2=Math.round(lab(comp(h,m))[0]),d=L2-L1;return `${nameOf(h)}: value ${L1} → complement ${L2} (${d>0?'+':''}${d}${Math.abs(d)<=5?', about the same value':d>0?', lighter':', darker'})`});
 return `<div class="wheelbox" data-hexes="${hs.join(',')}" data-pairs="${esc(JSON.stringify(pairs))}"><div class="wheelrow">${svg}${vs}</div>
 <div class="wctl"><div class="seg tval"><button data-v="0" aria-pressed="${!V}">Hue</button><button data-v="1" aria-pressed="${V}">Hue + value</button></div>
 ${V?`<label class="lbl wlbl">Wheel at value <input type="range" class="wl" min="10" max="95" value="${wl}" aria-label="Wheel lightness"> <b>${wl}</b></label>`:''}</div>
 <p class="note wcap">${hs.length===1?esc(pairs[0]):'Hover or tap a colour to see its complement and value change.'}</p></div>`}
const greyOf2=L=>{const Y=L>8?((L+16)/116)**3:L/903.3,v=Y<=.0031308?12.92*Y:1.055*Y**(1/2.4)-.055;return hex([v,v,v].map(x=>x*255))};
function rewheel(box){const hs=box.dataset.hexes.split(',');box.outerHTML=wheel(hs,st.wheel)}
document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('.wheelbox .pr');document.querySelectorAll('.wheelbox.hl').forEach(b=>{if(!g||!b.contains(g)){b.classList.remove('hl');b.querySelectorAll('.pr.on').forEach(x=>x.classList.remove('on'))}});
 if(!g)return;const box=g.closest('.wheelbox'),n=g.dataset.pair;box.classList.add('hl');box.querySelectorAll('.pr').forEach(x=>x.classList.toggle('on',x.dataset.pair===n));box.querySelector('.wcap').textContent=JSON.parse(box.dataset.pairs)[+n]});
document.addEventListener('input',e=>{if(!e.target.classList||!e.target.classList.contains('wl'))return;st.wl=+e.target.value;const box=e.target.closest('.wheelbox');e.target.nextElementSibling.textContent=st.wl;clearTimeout(rewheel.t);rewheel.t=setTimeout(()=>{const b=document.querySelector(`.wheelbox[data-hexes="${box.dataset.hexes}"]`);if(b){rewheel(b);const s=document.querySelector(`.wheelbox[data-hexes="${box.dataset.hexes}"] .wl`);s&&s.focus()}},60)});

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

 const u32=x=>{v.setUint32(o,x,true);o+=4},u16=x=>{v.setUint16(o,x,true);o+=2};
 u32(0x04034b50);u16(20);u16(0x0800);u16(0);u16(tm);u16(dt);u32(crc);u32(n);u32(n);u16(nm.length);u16(0);out.set(nm,o);o+=nm.length;out.set(data,o);o+=n;
 const cd=o;u32(0x02014b50);u16(20);u16(20);u16(0x0800);u16(0);u16(tm);u16(dt);u32(crc);u32(n);u32(n);u16(nm.length);u16(0);u16(0);u16(0);u16(0);u32(0);u32(0);out.set(nm,o);o+=nm.length;
 const cdl=o-cd;u32(0x06054b50);u16(0);u16(0);u16(1);u16(1);u32(cdl);u32(cd);u16(0);return out}

function swatchesFile(name,hexes){const json=JSON.stringify([{name,swatches:hexes.map(h=>{const [hu,s,v]=hsvOf(h);return {hue:hu,saturation:s,brightness:v,alpha:1,colorSpace:0}})}]);

 if(from==null||from===to||RM())return;const t0=performance.now(),D=300;cancelAnimationFrame(tweenCount.f);
 const step=now=>{const k=Math.min(1,(now-t0)/D),v=Math.round(from+(to-from)*(1-(1-k)**3));el.textContent=txt.replace(m[0],v);if(k<1)tweenCount.f=requestAnimationFrame(step)};tweenCount.f=requestAnimationFrame(step)}

const ptr=$('#ptr');let pull=null;
addEventListener('touchstart',e=>{if(st.tab==='mine'&&user&&sb&&scrollY<=0&&!document.body.classList.contains('open'))pull={y:e.touches[0].clientY,d:0}},{passive:true});
addEventListener('touchmove',e=>{if(!pull)return;pull.d=Math.max(0,e.touches[0].clientY-pull.y);ptr.style.height=Math.min(70,pull.d/2)+'px';ptr.classList.toggle('ready',pull.d>120)},{passive:true});
addEventListener('touchend',()=>{if(!pull)return;const go=pull.d>120;pull=null;if(!go){ptr.style.height='';ptr.classList.remove('ready');return}
 ptr.classList.add('spin');ptr.style.height='44px';Promise.resolve(loadPals()).finally(()=>{ptr.classList.remove('spin','ready');ptr.style.height=''})},{passive:true});

authUI();render();fromHash();
}).catch(()=>{document.getElementById('view').innerHTML='<p class="empty">Could not load the colour data.</p>'});
</script>
