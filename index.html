<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wada Colour Combinations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, gallery-like; the colours speak, the frame stays out of the way.
   IDEA: Wada's pocket swatch book — flat printed chips, numbered plates, tiny captions.
   PICTURE: a full-width ribbon of all 159 colours, then a wall of 348 combination plates.
   COLOUR and TYPE: paper white / ink black only, no accent; Zen Kaku Gothic New throughout.
   LAYOUT: ribbon + search up top, sticky filters, dense grid, a side sheet for detail. */
:root{color-scheme:light dark;--bg:light-dark(#fbfbfa,#141414);--ink:light-dark(#191919,#ececea);--mute:light-dark(#6d6d69,#9a9a96);--line:light-dark(#e3e2de,#2c2c2b);--card:light-dark(#fff,#1d1d1c);--chip:light-dark(#efeeea,#262625)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.band{padding:clamp(20px,3vw,44px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(32px,5vw,50px);line-height:1.05;margin:0;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mute);margin:.5em 0 0}
.ribbon{display:flex;height:clamp(90px,14vw,150px);margin-top:24px;border-radius:2px;overflow:hidden}
.ribbon button{flex:1;border:0;padding:0;transition:flex .25s}
.ribbon button:hover{flex:5}
.searchrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
#q{flex:1 1 320px;height:50px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0 16px;font-size:16px}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:8px;padding:4px}
.tabs button,.seg button{border:0;background:none;border-radius:6px;padding:8px 14px;min-height:40px}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 2px #0002;font-weight:700}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(4vw,16px)}
.bar .wrap{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;background:var(--chip);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{padding:6px 11px;min-height:36px;font-size:14px}
.gd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.gd-l{width:14px;height:14px;margin-right:10px}.hsub{font-size:14px;font-weight:400;color:var(--mute);margin-left:6px}
.legend{display:flex;gap:0;margin-top:6px}.legend button{border:0;border-top:2px solid var(--line);background:none;padding:6px 6px 0;box-shadow:inset 1px 0 0 var(--line);font-size:13px;color:var(--mute);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:32px}.legend button:hover{color:var(--ink);border-color:var(--ink)}
.top{display:flex;justify-content:space-between;gap:12px 20px;align-items:flex-start;flex-wrap:wrap}#auth{display:flex;gap:12px;align-items:center;font-size:14px;padding-top:10px}
.field{height:44px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 12px;font-size:16px;width:100%}textarea.field{height:auto;padding:10px 12px;resize:vertical}
#pname{font-size:20px;font-weight:700;margin:4px 0 16px}.pstripbig{height:170px}.strip.vstrip{height:15px}
.row-actions{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin:18px 0}
.mini{border:1px solid var(--line);background:var(--card);border-radius:4px;width:36px;height:36px;margin-left:3px}
.wt{width:64px;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--card);padding:0 6px;font-size:16px}
.ptable .rec{min-width:150px}.handle{cursor:grab;color:var(--mute);width:22px;user-select:none}tr.dragover td{border-top:2px solid var(--ink)}
.custom{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.custom .field{width:auto;flex:1 1 140px}
input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.schip{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:4px 14px 4px 5px;display:flex;align-items:center;gap:4px;font-size:14px;min-height:44px}.schip .dot{width:32px;height:32px;border-radius:50%;margin-right:6px}
.danger{color:#c2361f}.newstrip{align-items:center;justify-content:center;border:1.5px dashed var(--line);box-shadow:none;color:var(--mute)}
.emptystrip{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;background:var(--chip)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px #0002;padding:10px max(4vw,16px)}
.dockin{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto auto;gap:12px;align-items:center}.dstrip{height:44px}
body.adding{padding-bottom:96px}body.adding .card,body.adding .ribbon button{cursor:copy}
@media(max-width:700px){.dockin{grid-template-columns:1fr 1fr}.dockin>div:first-child,.dstrip{grid-column:1/-1}}
.ptiles{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.pcard .meta{display:block}.pcard .meta span{display:block;white-space:normal}.pcard{position:relative}
.addp{position:absolute;top:6px;right:6px;z-index:2;width:30px;height:30px;border-radius:50%;border:1px solid #ffffff99;background:#00000040;backdrop-filter:blur(4px);color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s}
.addp:hover{background:#00000080}.addp.on{background:var(--ink);color:var(--bg);border-color:transparent;font-size:15px}
@media(hover:none){.addp{width:36px;height:36px}}
.pswatch{display:flex;height:84px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px #0000000d}.pswatch span{flex:1}
.big2{height:150px}.big2 span{display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:700}
.own{border:1px solid var(--line);background:var(--card);border-radius:6px;min-height:38px;font-size:14px}.own.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini.wide{width:auto;padding:0 10px}
.mixcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.recipe{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.rsw{display:flex;height:72px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px #0000001a}.rsw span{flex:1}
.rings{display:flex;flex-direction:column;gap:4px;font-size:14px}.ring i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px #0000001a}
.need{font-style:normal;font-size:12px;color:#c2361f}.de{display:inline-block;margin-top:6px;font-size:13px;color:var(--mute)}.de.good{color:#2f7d45}.de.bad{color:#c2361f}.tip{margin-top:10px}
@media(max-width:700px){.mixcols{grid-template-columns:1fr}}
.lbl{font-size:13px;color:var(--mute)}
select{height:42px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 10px}
#count{margin-left:auto;font-size:14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 14px}
.card{border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.strip{display:flex;height:96px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px #0000000d}
.strip span{flex:1}
.card:hover .strip{transform:translateY(-2px);box-shadow:0 6px 16px #0002}
.strip{transition:transform .15s,box-shadow .15s}
.meta{display:flex;gap:8px;font-size:13px;margin-top:6px;align-items:baseline}
.meta b{font-size:15px}.meta span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 12px}
.tiles .card{align-self:start}
.tile .sw{height:110px;border-radius:2px;box-shadow:0 0 0 1px #0000000d}
.tile .meta{display:block}.tile .meta span{display:block}
h2{font-size:22px;margin:34px 0 14px;font-weight:700}
h2:first-child{margin-top:4px}
.empty{color:var(--mute);padding:40px 0}
/* sheet */
#scrim{position:fixed;inset:0;background:#0006;z-index:20;display:none}
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);z-index:21;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 40px #0003}
body.open #scrim{display:block}body.open #sheet{transform:none}
.shead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:14px 22px;border-bottom:1px solid var(--line);z-index:2}
.shead h3{margin:0;font-size:20px;flex:1}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:6px;min-width:44px;height:44px;padding:0 12px}
.sbody{padding:20px 22px 60px}
.big{display:flex;height:min(36vh,260px);border-radius:2px;overflow:hidden}
.big button{flex:1;border:0;padding:10px;display:flex;align-items:flex-end;font-size:13px;font-weight:700}
.toggles{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin:22px 0 12px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.cap{font-size:13px;color:var(--mute);margin:14px 0 6px}
.comp .strip{height:120px}
.wheel{width:100%;aspect-ratio:1;max-width:280px}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
th{font-weight:500;color:var(--mute);text-align:left;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.dot{display:inline-block;width:34px;height:34px;border-radius:3px;vertical-align:middle;margin-right:8px;box-shadow:0 0 0 1px #0000001a}
.code{font-variant-numeric:tabular-nums;white-space:nowrap}
.copy{border:0;background:var(--chip);border-radius:4px;padding:3px 8px;font-size:12px;margin-left:4px}
.scale{display:flex;height:34px;border-radius:2px;overflow:hidden;min-width:150px}
.scale span{flex:1}.scale span.on{flex:1.6;box-shadow:inset 0 0 0 2px var(--bg)}
.note{font-size:13px;color:var(--mute)}
.linkc{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.sw-hero{height:220px;border-radius:2px;display:flex;align-items:flex-end;padding:14px;font-weight:700}
@media(max-width:700px){.duo{grid-template-columns:1fr}.wheel{margin:0 auto;display:block}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.strip{height:80px}#count{margin-left:0;width:100%}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="top"><h1>A Dictionary of Colour Combinations</h1><div id="auth"></div></div>
  <p class="sub">Sanzo Wada · Volume 1 · 348 combinations drawn from 159 colours. Colours are arranged in six hue families — click a family below the ribbon to browse it.</p>
  <div class="ribbon" id="ribbon" aria-label="All 159 colours"></div><div class="legend" id="legend"></div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="Search a name, combination (#240), hex (#BB451C) or CMYK (22 84 100 18)" autocomplete="off" aria-label="Search">
    <div class="tabs" role="group" aria-label="View">
      <button data-tab="combos" aria-pressed="true">Combinations</button>
      <button data-tab="colours" aria-pressed="false">Colours</button>
      <button data-tab="paints" aria-pressed="false">Paints</button>
      <button data-tab="mine" aria-pressed="false" hidden>My palettes</button>
    </div>
  </div>
</div></header>
<div class="bar"><div class="wrap">
  <span class="lbl">Size</span>
  <div class="seg" id="fsize"></div>
  <span class="lbl">Hue family</span>
  <div class="seg" id="fchap"></div>
  <label class="lbl" for="sort">Sort</label>
  <select id="sort"><option value="book">Book order</option><option value="hue">Hue</option><option value="light">Light → dark</option><option value="sat">Most vivid</option></select>
  <span id="count"></span>
</div></div>
<main class="band" style="padding-top:22px"><div class="wrap" id="view"></div></main>
<div id="scrim"></div>
<aside id="sheet" aria-modal="true" role="dialog" aria-labelledby="stitle">
  <div class="shead"><h3 id="stitle"></h3><span id="sextra"></span><button class="ibtn" id="close" aria-label="Close">✕</button></div>
  <div class="sbody" id="sbody"></div>
</aside>
<div id="dock" hidden></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vendor/mixbox.js"></script>
<script src="mix.js"></script>
<script>
Promise.all([fetch('colors.json').then(r=>r.json()),fetch('paints.json').then(r=>r.json()).catch(()=>[])]).then(([raw,paints])=>{window.__PAINTS=paints;
const DATA={colors:raw.map(x=>({n:x.name,h:x.hex.toUpperCase(),c:x.cmyk,l:x.lab,s:x.swatch+1,k:x.combinations}))};
const C=DATA.colors;
const COMBOS={};C.forEach((c,i)=>c.k.forEach(k=>(COMBOS[k]??=[]).push(i)));
const IDS=Object.keys(COMBOS).map(Number).sort((a,b)=>a-b);
const $=s=>document.querySelector(s);
const GROUPS=['','Reds & pinks','Yellows & oranges','Greens','Blues','Purples & violets','Neutrals'],GSHORT=['All','Reds','Yellows','Greens','Blues','Purples','Neutrals'],GDESC=['','Including warm red-browns','Including buffs, cinnamons and creams','Including olives and yellow-greens','Including turquoise and blue-greens','Including lavenders and mauves','White, greys and black'],GDOT=['','#C84F41','#F5B82E','#4F8A4B','#1F6FA8','#7B4A8C','#8A8A86'];
const st={tab:'combos',size:0,chap:0,sort:'book',q:'',wheel:'ryb',show:'exact'};
try{Object.assign(st,{wheel:localStorage.getItem('w-wheel')||'ryb',show:localStorage.getItem('w-show')||'exact'})}catch(e){}
let favs=[];try{favs=JSON.parse(localStorage.getItem('w-favs')||'[]')}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('w-favs',JSON.stringify(favs))}catch(e){}};

/* colour maths */
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
function hsl(h){const [r,g,b]=rgb(h).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let H=0,S=0;
 if(d){S=d/(1-Math.abs(2*l-1));H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;if(H<0)H+=360}return [H,S,l]}
function fromHsl(H,S,L){H=((H%360)+360)%360;const c=(1-Math.abs(2*L-1))*S,x=c*(1-Math.abs((H/60)%2-1)),m=L-c/2;
 const [r,g,b]=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];return hex([r,g,b].map(v=>(v+m)*255))}
function lab(h){const v=rgb(h).map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4});
 const X=(v[0]*.4124+v[1]*.3576+v[2]*.1805)/.95047,Y=v[0]*.2126+v[1]*.7152+v[2]*.0722,Z=(v[0]*.0193+v[1]*.1192+v[2]*.9505)/1.08883;
 const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return [116*f(Y)-16,500*(f(X)-f(Y)),200*(f(Y)-f(Z))]}
const dE=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const chroma=c=>Math.hypot(c.l[1],c.l[2]);
/* painter's (RYB) wheel: piecewise map between screen hue and artist hue */
const A=[[0,0],[30,60],[60,120],[120,180],[240,240],[285,300],[360,360]];
function mapH(h,f,t){h=((h%360)+360)%360;for(let i=0;i<A.length-1;i++){const a=A[i],b=A[i+1];if(h>=a[f]&&h<=b[f])return a[t]+(h-a[f])/(b[f]-a[f])*(b[t]-a[t])}return h}
const toRyb=h=>mapH(h,0,1),fromRyb=h=>mapH(h,1,0);
const wheelAngle=(h,m)=>m==='ryb'?toRyb(hsl(h)[0]):hsl(h)[0];
function comp(h,m){const [H,S,L]=hsl(h);return fromHsl(m==='ryb'?fromRyb(toRyb(H)+180):H+180,S,L)}
function nearest(h,n=1,skip=-1){const L=lab(h);return C.map((c,i)=>[i,dE(L,c.l)]).filter(x=>x[0]!==skip).sort((a,b)=>a[1]-b[1]).slice(0,n)}
const textOn=h=>lab(h)[0]>60?'#1a1a1a':'#fafafa';
const mix=(h,t,p)=>hex(rgb(h).map((v,i)=>v+(rgb(t)[i]-v)*p));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* rendering pieces */
const strip=ids=>`<div class="strip">${ids.map(i=>`<span style="background:${C[i].h}"></span>`).join('')}</div>`;
const card=id=>`<button class="card" data-combo="${id}" title="${esc(COMBOS[id].map(i=>C[i].n).join(', '))}">${strip(COMBOS[id])}<div class="meta"><b>${id}</b><span>${esc(COMBOS[id].map(i=>C[i].n).join(' · '))}</span></div></button>`;
const tile=i=>`<button class="card tile" data-colour="${i}"><div class="sw" style="background:${C[i].h}"></div><div class="meta"><b>${esc(C[i].n)}</b><span>${C[i].h} · ${C[i].c.join(' ')}</span><span><i class="gd" style="background:${GDOT[C[i].s]}"></i>${GSHORT[C[i].s]}</span></div></button>`;
const sortKey={book:()=>0,hue:id=>hsl(C[COMBOS[id][0]].h)[0],light:id=>-COMBOS[id].reduce((s,i)=>s+C[i].l[0],0)/COMBOS[id].length,sat:id=>-COMBOS[id].reduce((s,i)=>s+chroma(C[i]),0)/COMBOS[id].length};
function filtered(){let L=IDS.filter(id=>(!st.size||COMBOS[id].length===st.size)&&(!st.chap||COMBOS[id].some(i=>C[i].s===st.chap)));
 if(st.sort!=='book'){const f=sortKey[st.sort];L=L.map(id=>[id,f(id)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0])}return L}

function search(q){q=q.trim();const lq=q.toLowerCase();let m,cols=[],combos=[],note='';
 if((m=lq.match(/^#?(\d{1,3})$/))&&COMBOS[+m[1]]){combos=[+m[1]];cols=COMBOS[+m[1]]}
 else if(m=lq.match(/^#?([0-9a-f]{6})$/)){const h='#'+m[1].toUpperCase();const nn=nearest(h,8);cols=nn.map(x=>x[0]);note=nn[0][1]<1?`Exact match: ${esc(C[nn[0][0]].n)}.`:`No exact match for ${h} — nearest Wada colours, closest first.`;combos=[...new Set(C[cols[0]].k)]}

/* wheel graphic */
function wheel(hs,m){const S=280,c=S/2,R=128,seg=48;let w='';
 for(let k=0;k<seg;k++){const a0=k*360/seg,a1=(k+1)*360/seg,mid=(a0+a1)/2,hh=m==='ryb'?fromRyb(mid):mid,p=a=>[c+R*Math.sin(a*Math.PI/180),c-R*Math.cos(a*Math.PI/180)],[x0,y0]=p(a0),[x1,y1]=p(a1);
  w+=`<path d="M${c},${c}L${x0},${y0}A${R},${R} 0 0 1 ${x1},${y1}Z" fill="${fromHsl(hh,.75,.55)}"/>`}
 w+=`<circle cx="${c}" cy="${c}" r="${R*.82}" fill="var(--bg)"/>`;
 hs.forEach(h=>{const Lb=lab(h),a=wheelAngle(h,m),r=R*(.18+.6*Math.min(1,Math.hypot(Lb[1],Lb[2])/80)),pt=a=>[c+r*Math.sin(a*Math.PI/180),c-r*Math.cos(a*Math.PI/180)],[x,y]=pt(a),[x2,y2]=pt(a+180),ch=comp(h,m);
  w+=`<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="var(--mute)" stroke-dasharray="3 3"/><circle cx="${x2}" cy="${y2}" r="9" fill="${ch}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 2"/><circle cx="${x}" cy="${y}" r="12" fill="${h}" stroke="var(--ink)" stroke-width="1.5"/>`});
 return `<svg class="wheel" viewBox="0 0 ${S} ${S}" role="img" aria-label="${m==='ryb'?"Painter's":'Screen'} colour wheel showing each colour (solid) and its complement (dashed)">${w}</svg>`}

const scale=h=>`<div class="scale" title="Tints with white, shades with black">${[.75,.5,.25].map(p=>`<span style="background:${mix(h,'#ffffff',p)}"></span>`).join('')}<span class="on" style="background:${h}"></span>${[.25,.5].map(p=>`<span style="background:${mix(h,'#000000',p)}"></span>`).join('')}</div>`;
const copyBtn=t=>`<button class="copy" data-copy="${t}">Copy</button>`;
const toggles=()=>`<div class="toggles"><span class="lbl">Wheel</span><div class="seg" id="twheel"><button data-v="ryb" aria-pressed="${st.wheel==='ryb'}">Painter's (RYB)</button><button data-v="rgb" aria-pressed="${st.wheel==='rgb'}">Screen (RGB)</button></div><span class="lbl">Complement as</span><div class="seg" id="tshow"><button data-v="exact" aria-pressed="${st.show==='exact'}">Exact colour</button><button data-v="wada" aria-pressed="${st.show==='wada'}">Nearest Wada</button></div></div>`;
function compOf(i){const ex=comp(C[i].h,st.wheel),[ni,d]=nearest(ex,1,i)[0];return {ex,ni,d}}
const neutral=i=>chroma(C[i])<12;

 ${sugg.length?`<h2>Wada pairs these with your colours</h2><div class="chips">${sugg.map(j=>chip(j,`Shares ${co[j]} combination${co[j]>1?'s':''} with this palette`)).join('')}</div>`:''}
 ${comps.length?`<h2>Complements · nearest Wada</h2><div class="chips">${comps.map(j=>chip(j,'Nearest Wada colour to a complement')).join('')}</div>`:''}
 ${hs.length?`${toggles()}<div class="duo"><div><p class="cap">Complementary group</p><div class="strip">${hs.map(h=>`<span style="background:${st.show==='exact'?comp(h,st.wheel):C[nearest(comp(h,st.wheel),1)[0][0]].h}"></span>`).join('')}</div></div>${wheel(hs,st.wheel)}</div>`:''}
 <h2>Notes</h2><textarea id="pnotes" class="field" rows="4" placeholder="Painting title, ideas, surface, references…">${esc(p.notes||'')}</textarea>
 <div class="row-actions"><button class="ibtn" id="pdup">Duplicate</button><button class="ibtn danger" id="pdel">Delete palette</button></div>`}

function palAction(t){const p=P(active);
 if(t.id==='signin'){openSheet({signin:true});return true}
 if(t.id==='signout'){sb.auth.signOut();return true}
 if(t.id==='newpal'){newPal().then(p=>p&&openSheet({pal:p.id}));return true}
 if(t.dataset.pal){openSheet({pal:t.dataset.pal});return true}
 if(t.id==='add-combo'||t.id==='add-colour'){const items=cur.combo?COMBOS[cur.combo].map(fromWada):[fromWada(cur.colour)];
  if(p)addItems(items);else newPal(items,cur.combo?`From combination ${cur.combo}`:C[cur.colour].n).then(q=>q&&openSheet({pal:q.id}));return true}
 if(t.id==='dockopen'){adding=false;dock();openSheet({pal:active});return true}
 if(t.id==='dockdone'){adding=false;dock();return true}
 if(!p)return false;
 if(t.id==='addmode'){adding=true;closeSheet();dock();toast('Click any colour or combination to add it');return true}
 if(t.dataset.sugg){addItems([fromWada(+t.dataset.sugg)]);return true}
 if(t.dataset.rm!=null){p.colours.splice(+t.dataset.rm,1);save(p);openSheet(cur,true);return true}
 if(t.dataset.mv){const [n,d]=t.dataset.mv.split(',').map(Number),m=n+d;if(m<0||m>=p.colours.length)return true;[p.colours[n],p.colours[m]]=[p.colours[m],p.colours[n]];save(p);openSheet(cur,true);return true}
 if(t.id==='cadd'){const hx=$('#chex').value.trim(),cm=$('#ccmyk').value.trim().split(/[\s,\/]+/).map(Number);let it=null;
  if(/^#?[0-9a-f]{6}$/i.test(hx))it={ref:null,hex:'#'+hx.replace('#','').toUpperCase(),cmyk:null,weight:10,recipe:''};
  else if(cm.length===4&&cm.every(v=>v>=0&&v<=100))it={ref:null,hex:cmykHex(cm),cmyk:cm,weight:10,recipe:''};
  if(!it){toast('Enter a hex code or four CMYK numbers (0–100)');return true}addItems([it]);return true}
 if(t.id==='pdup'){newPal(JSON.parse(JSON.stringify(p.colours)),p.name+' copy').then(q=>q&&openSheet({pal:q.id}));return true}
 if(t.id==='pdel'){if(!t.dataset.confirm){t.dataset.confirm=1;t.textContent='Click again to delete for good';return true}
  sb.from('palettes').delete().eq('id',p.id).then(({error})=>{if(error)return toast('Could not delete');pals=pals.filter(x=>x.id!==p.id);active=null;closeSheet();render();toast('Palette deleted')});return true}
 return false}
document.addEventListener('input',e=>{const p=P(active),t=e.target;if(!p||!cur||!cur.pal)return;
 if(t.id==='pname'){p.name=t.value||'Untitled palette';$('#stitle').textContent=p.name;save(p)}
 else if(t.id==='pnotes'){p.notes=t.value;save(p)}
 else if(t.dataset.rec!=null){p.colours[+t.dataset.rec].recipe=t.value;save(p)}
 else if(t.id==='cpick'){$('#chex').value=t.value.toUpperCase();$('#ccmyk').value=''}});
document.addEventListener('change',e=>{const p=P(active),t=e.target;if(!p||t.dataset.wt==null)return;p.colours[+t.dataset.wt].weight=Math.max(0,Math.min(100,+t.value||0));save(p);openSheet(cur,true)});
document.addEventListener('submit',async e=>{if(e.target.id!=='signform')return;e.preventDefault();const m=$('#smsg');m.textContent='Sending…';
 const {error}=await sb.auth.signInWithOtp({email:$('#semail').value.trim(),options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
 m.textContent=error?'That email can’t sign in here.':'Check your email for the sign-in link.'});
let dragFrom=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('tr[data-row]');if(r){dragFrom=+r.dataset.row;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const r=e.target.closest&&e.target.closest('tr[data-row]');if(r&&dragFrom!=null){e.preventDefault();document.querySelectorAll('tr.dragover').forEach(x=>x.classList.remove('dragover'));r.classList.add('dragover')}});
document.addEventListener('drop',e=>{const r=e.target.closest&&e.target.closest('tr[data-row]'),p=P(active);if(!r||dragFrom==null||!p)return;e.preventDefault();
 const to=+r.dataset.row,[it]=p.colours.splice(dragFrom,1);p.colours.splice(to,0,it);dragFrom=null;save(p);openSheet(cur,true)});
document.addEventListener('dragend',()=>{dragFrom=null;document.querySelectorAll('tr.dragover').forEach(x=>x.classList.remove('dragover'))});

/* ---------- Michael Harding paints, owned paints and mixing ---------- */
const PAINTS=(window.__PAINTS||[]).filter(p=>p.availability!=='Withdrawn');
const MIXER=window.makeMixer&&window.mixbox?window.makeMixer(window.mixbox):null;
const PALL=MIXER?MIXER.prepare(PAINTS):[];
const PBY={};PAINTS.forEach(p=>PBY[p.no]=p);
let owned=new Set();const mixCache={};
const FAMS=['Whites','Yellows and Oranges','Reds and Violets','Blues and Greens','Browns','Greys and Blacks'];
const pst={own:false,fam:''};
async function loadOwned(){const {data,error}=await sb.from('owned_paints').select('paint_no');if(error){console.error('owned',error);toast('Could not load your box of paints: '+(error.message||error.code));return}
 owned=new Set(data.map(r=>r.paint_no));for(const k in mixCache)delete mixCache[k];if(st.tab==='paints')render();if(cur&&(cur.colour!=null||cur.mix||cur.paint))openSheet(cur,true)}
async function toggleOwned(no){const had=owned.has(no);had?owned.delete(no):owned.add(no);for(const k in mixCache)delete mixCache[k];
 const q=had?sb.from('owned_paints').delete().eq('paint_no',no):sb.from('owned_paints').insert({paint_no:no});const {error}=await q;
 if(error){had?owned.add(no):owned.delete(no);console.error('owned_paints',error);toast(/owned_paints|relation|schema cache|PGRST205|42P01/i.test(error.message+error.code)?'Box of paints isn’t set up in Supabase yet: run the owned_paints SQL':'Could not save: '+(error.message||error.code||'unknown error'))}
 if(st.tab==='paints')render();if(cur&&cur.paint)openSheet(cur,true)}
/* spread each family's paints over even rows (9 paints -> 5 + 4, not 8 + 1), keeping one card width */
function balanceTiles(){const gap=12,minW=180;document.querySelectorAll('.ptiles').forEach(g=>{const W=g.clientWidth,n=g.children.length;if(!W||!n)return;
 const max=Math.max(1,Math.floor((W+gap)/(minW+gap))),w=(W-gap*(max-1))/max,rows=Math.ceil(n/max),cols=Math.ceil(n/rows);
 g.style.gridTemplateColumns=`repeat(${cols},${w}px)`})}
let balT;window.addEventListener('resize',()=>{clearTimeout(balT);balT=setTimeout(balanceTiles,100)});
const paintCard=p=>`<div class="pcard">${user?`<button class="addp ${owned.has(p.no)?'on':''}" data-own="${p.no}" aria-pressed="${owned.has(p.no)}" aria-label="${owned.has(p.no)?'Remove '+esc(p.name)+' from':'Add '+esc(p.name)+' to'} your box of paints" title="${owned.has(p.no)?'In your box of paints — click to remove':'Add to your box of paints'}">${owned.has(p.no)?'✓':'+'}</button>`:''}<button class="card" data-paint="${p.no}"><div class="pswatch"><span style="background:${p.masstone}" title="Measured masstone"></span><span style="background:${p.swatch}" title="Chart swatch"></span></div>
 <div class="meta"><b>${esc(p.name)}</b><span>No. ${p.no} · Series ${p.series} · ${esc(p.pigments.join(', '))}</span><span>${esc(p.opacity)} · tint ${esc(p.tint.toLowerCase())}</span></div></button>
</div>`;
function paintsView(){let L=PAINTS.filter(p=>(!pst.own||owned.has(p.no))&&(!pst.fam||p.family===pst.fam));
 const q=st.q.trim().toLowerCase();if(q)L=L.filter(p=>p.name.toLowerCase().includes(q)||p.no===q.replace(/^no\.?\s*/,'')||p.pigments.some(g=>g.toLowerCase()===q.replace(/\s/g,'')));
 $('#count').textContent='';
 const ctl=`<div class="row-actions"><div class="seg" id="pfam">${['',...FAMS].map(f=>`<button data-v="${esc(f)}" aria-pressed="${pst.fam===f}">${f?esc(f):'All'}</button>`).join('')}</div>
 ${user?`<div class="seg" id="pown"><button data-v="0" aria-pressed="${!pst.own}">All paints</button><button data-v="1" aria-pressed="${pst.own}">My box (${owned.size})</button></div>`:'<span class="note"><button class="linkc" id="signin">Sign in</button> to build your box of paints.</span>'}</div>
 <p class="note">Michael Harding Artists Oil Colours: ${PAINTS.length} colours. Left swatch: measured masstone (straight from the tube). Right: the chart swatch. Data from michaelharding.co.uk; measurements by Artist Pigments.</p>`;
 if(!L.length)return ctl+`<p class="empty">${pst.own?'Your box of paints is empty. Press + on a paint to add it.':'No paints match.'}</p>`;
 return ctl+FAMS.filter(f=>L.some(p=>p.family===f)).map(f=>`<h2>${esc(f)} <span class="hsub">${L.filter(p=>p.family===f).length}</span></h2><div class="tiles ptiles">${L.filter(p=>p.family===f).map(paintCard).join('')}</div>`).join('')}

function paintHTML(no){const p=PBY[no],nn=nearest(p.masstone,4);
 return `<div class="pswatch big2"><span style="background:${p.masstone};color:${textOn(p.masstone)}">Masstone (measured)</span><span style="background:${p.swatch};color:${textOn(p.swatch)}">Chart swatch</span></div>
 ${user?`<div class="row-actions"><button class="own ${owned.has(no)?'on':''}" data-own="${no}" aria-pressed="${owned.has(no)}">${owned.has(no)?'✓ In my box of paints':'+ Add to my box of paints'}</button></div>`:''}
 <table class="stack"><tbody>${[['Number',`No. ${p.no} · Series ${p.series}`],['Pigments',p.pigments.join(', ')],['Opacity',p.opacity],['Tint power',p.tint],['Temperature',p.temp],['Drying',p.drying],['Lightfastness',p.lightfast],['Oil',p.oil],['Toxic',p.toxic?'Yes — read the label':'No'],['Masstone CIELAB',p.lab.join(' / ')],['Used for mixing',`${p.mix} (${p.mixSource})`]].map(([k,v])=>`<tr><td class="lbl">${k}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
 ${p.note?`<p class="note">${esc(p.note)}</p>`:''}
 <p><a href="https://michaelharding.co.uk/oil-colours/${p.slug}">View on michaelharding.co.uk</a></p>
 <h2>Closest Wada colours</h2><div class="tiles">${nn.map(x=>tile(x[0])).join('')}</div>`}

const closeness=de=>de<2?['Near-identical','good']:de<5?['Close','good']:de<10?['Noticeable difference','mid']:['Far: outside what these paints can reach','bad'];
const fmtParts=n=>n===0.5?'½':n%1?`${Math.floor(n)}½`:String(n);
function recipeHTML(r,target){const [lab,cls]=closeness(r.de);
 return `<div class="recipe"><div class="rsw"><span style="background:${target}" title="Target"></span><span style="background:${r.hex}" title="Predicted mix"></span></div>
 <div><div class="rings">${r.paints.map(p=>`<span class="ring"><i style="background:${PBY[p.no].swatch}"></i><b>${fmtParts(p.parts)}</b> ${esc(p.name)}${user&&!owned.has(p.no)?' <em class="need">not in your box</em>':''}</span>`).join('')}</div>
 <span class="de ${cls}">${lab} · ΔE ${r.de.toFixed(1)}</span></div></div>`}
function mixSection(hex){return MIXER?`<h2>Mix it in Michael Harding oils</h2><div class="mixout" data-mixhex="${hex}"><p class="note">Working out recipes…</p></div>`:''}
function fillMix(){const el=document.querySelector('.mixout[data-mixhex]');if(!el||!MIXER)return;const hex=el.dataset.mixhex;
 const key=hex+'|'+[...owned].sort().join(',');
 const run=()=>{if(!mixCache[key]){const all=MIXER.solve(hex,PALL);let mine=null,tip=null;
   if(user&&owned.size){const mineP=PALL.filter(p=>owned.has(p.no));mine=MIXER.solve(hex,mineP);
    if(mine.length&&all.length&&mine[0].de>all[0].de+3){const extra=[...new Set(all.flatMap(r=>r.paints.map(p=>p.no)))].filter(n=>!owned.has(n)).slice(0,4);
     let best=null;extra.forEach(n=>{const r=MIXER.solve(hex,mineP.concat(PALL.filter(p=>p.no===n)),{top:1,cand:10})[0];if(r&&(!best||r.de<best.de))best={no:n,de:r.de}});
     if(best&&best.de<mine[0].de-2)tip=best}}
   mixCache[key]={all,mine,tip}}
  const {all,mine,tip}=mixCache[key],cell=document.querySelector(`.mixout[data-mixhex="${hex}"]`);if(!cell)return;
  cell.innerHTML=`<div class="mixcols"><div><p class="cap">With every Michael Harding colour</p>${all.map(r=>recipeHTML(r,hex)).join('')}</div>
   <div><p class="cap">With your box of paints</p>${!user?'<p class="note"><button class="linkc" id="signin">Sign in</button> and build your box of paints to see what you can mix today.</p>':!owned.size?'<p class="note">Add paints to your box in the <button class="linkc" data-tab="paints">Paints</button> tab.</p>':mine.map(r=>recipeHTML(r,hex)).join('')}
   ${tip?`<p class="note tip">Adding <button class="linkc" data-paint="${tip.no}">${esc(PBY[tip.no].name)}</button> would get you to ΔE ${tip.de.toFixed(1)}.</p>`:''}</div></div>
   <p class="note">Parts are by volume, adjusted for each paint's tinting strength. The predictions use the Mixbox pigment model and Michael Harding's published masstone data: treat them as a starting point and adjust by eye. ΔE under 2 is near-invisible; over 10 is clearly different.</p>`};
 setTimeout(run,30)}

/* events */
$('#legend').innerHTML=[1,2,3,4,5,6].map(s=>`<button data-fam="${s}" style="flex:${C.filter(c=>c.s===s).length}" title="Show ${GROUPS[s]}">${GSHORT[s]}</button>`).join('');
$('#fsize').innerHTML=[0,...[...new Set(IDS.map(id=>COMBOS[id].length))].sort((a,b)=>a-b)].map(v=>`<button data-v="${v}" aria-pressed="${v===0}">${v||'All'}</button>`).join('');
$('#fchap').innerHTML=GSHORT.map((n,v)=>`<button data-v="${v}" aria-pressed="${v===0}">${v?`<i class="gd" style="background:${GDOT[v]}"></i>`:''}${n}</button>`).join('');
$('#ribbon').innerHTML=C.map((c,i)=>[i,c]).sort((a,b)=>a[1].s-b[1].s||hsl(a[1].h)[0]-hsl(b[1].h)[0]).map(([i,c])=>`<button data-colour="${i}" style="background:${c.h}" title="${esc(c.n)}" aria-label="${esc(c.n)}"></button>`).join('');
document.addEventListener('click',e=>{const t=e.target.closest('[data-fam],[data-combo],[data-colour],[data-pal],[data-sugg],[data-mv],[data-rm],[data-copy],[data-tab],#fsize button,#fchap button,#twheel button,#tshow button,#fav,#close,#scrim,#newpal,#addmode,#cadd,#pdup,#pdel,#dockopen,#dockdone,#signin,#signout,#add-combo,#add-colour,[data-paint],[data-own],[data-mixrow],#pfam button,#pown button');if(!t)return;
 if(t.dataset.own){toggleOwned(t.dataset.own);return}
 if(t.dataset.paint&&!adding){openSheet({paint:t.dataset.paint});return}
 if(t.dataset.mixrow!=null){const p=P(active),x=p&&p.colours[+t.dataset.mixrow];if(x)openSheet({mix:itemHex(x),label:itemName(x),back:p.id});return}
 if(t.parentElement.id==='pfam'){pst.fam=t.dataset.v;render();return}
 if(t.parentElement.id==='pown'){pst.own=t.dataset.v==='1';render();return}
 if(adding&&P(active)&&!t.closest('#sheet,#dock')){if(t.dataset.combo){addItems(COMBOS[+t.dataset.combo].map(fromWada));return}if(t.dataset.colour){addItems([fromWada(+t.dataset.colour)]);return}}
 if(palAction(t))return;
 if(t.dataset.fam){st.tab='colours';st.chap=+t.dataset.fam;st.q='';$('#q').value='';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab==='colours'));setSeg($('#fchap'),st.chap);render();$('.bar').scrollIntoView({behavior:'smooth'});return}
 if(t.dataset.copy){navigator.clipboard?.writeText(t.dataset.copy).then(()=>toast('Copied '+t.dataset.copy),()=>toast('Copy blocked — select the text instead'));return}
 if(t.id==='close'||t.id==='scrim')return closeSheet();
 if(t.id==='fav'){const id=cur.combo;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFavs();t.textContent=favs.includes(id)?'★ Saved':'☆ Save';if(st.tab==='mine')render();return}
 if(t.dataset.tab){if(cur)closeSheet();st.tab=t.dataset.tab;st.q='';$('#q').value='';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b===t));render();return}
 const p=t.parentElement;
 if(p.id==='fsize'){st.size=+t.dataset.v;setSeg(p,st.size);render();return}
 if(p.id==='fchap'){st.chap=+t.dataset.v;setSeg(p,st.chap);render();return}
 if(p.id==='twheel'||p.id==='tshow'){st[p.id==='twheel'?'wheel':'show']=t.dataset.v;try{localStorage.setItem('w-wheel',st.wheel);localStorage.setItem('w-show',st.show)}catch(e){}const y=$('#sheet').scrollTop;openSheet(cur);$('#sheet').scrollTop=y;return}
 if(t.dataset.combo)return openSheet({combo:+t.dataset.combo});
 if(t.dataset.colour)return openSheet({colour:+t.dataset.colour});});
$('#sort').addEventListener('change',e=>{st.sort=e.target.value;render()});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value;render()},120)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeSheet();if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}});
window.addEventListener('hashchange',fromHash);
if(sb)sb.auth.onAuthStateChange((ev,s)=>{const was=user&&user.id;user=s&&s.user||null;authUI();if(user&&user.id!==was)setTimeout(()=>{loadPals();loadOwned()},0);if(!user){pals=[];owned=new Set();active=null;adding=false;dock();if(cur&&cur.pal)closeSheet();render()}});
authUI();render();fromHash();
}).catch(()=>{document.getElementById('view').innerHTML='<p class="empty">Could not load the colour data.</p>'});
</script>
</body>
