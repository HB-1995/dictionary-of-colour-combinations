name: Check colour data

on:
  push:
    branches: [master]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

# The site itself is deployed by Vercel on every push; this workflow
# validates the data and marks the commit with a red cross if it fails.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate colour libraries
        run: python3 scripts/check_sources.py
