name: Check data and deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate colour data
        run: |
          python3 - <<'EOF'
          import json, re, sys
          from collections import Counter
          colours = json.load(open('colors.json'))
          palettes = json.load(open('palettes.json'))
          names = {c['name'] for c in colours}
          errors = []
          for c in colours:
              n = c['name']
              if len(c['cmyk']) != 4 or any(not 0 <= v <= 100 for v in c['cmyk']):
                  errors.append(f"{n}: CMYK must be four values from 0 to 100, got {c['cmyk']}")
              if not re.fullmatch(r'#[0-9a-fA-F]{6}', c['hex']):
                  errors.append(f"{n}: bad hex {c['hex']}")
              if not 0 <= c['swatch'] <= 5:
                  errors.append(f"{n}: hue family must be 0-5, got {c['swatch']}")
          dupes = [n for n, k in Counter(c['name'] for c in colours).items() if k > 1]
          errors += [f"Duplicate colour name: {n}" for n in dupes]
          sizes = Counter(i for c in colours for i in c['combinations'])
          errors += [f"Combination {i} has only {k} colour; needs at least 2" for i, k in sizes.items() if k < 2]
          for g in palettes['groups']:
              if not g['colours']:
                  errors.append(f"{g['name']}: palette is empty")
              errors += [f"{g['name']}: unknown colour '{n}'" for n in g['colours'] if n not in names]
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f"OK: {len(colours)} colours, {len(sizes)} combinations, {len(palettes['groups'])} palettes")
          EOF

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp index.html colors.json palettes.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
